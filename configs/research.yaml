seed: 42
experiment: moe

model:
  pretrained_model: facebook/mms-300m
  num_dialects: 4
  num_tokens: 64
  use_moe: true
  use_router: true
  use_shared_expert: true
  top_k: 2
  dropout: 0.1
  gradient_checkpointing: true

loss:
  ctc_weight: 1.0
  dialect_weight: 0.2
  balance_weight: 0.01

training:
  per_device_batch_size: 1
  gradient_accumulation_steps: 16
  mixed_precision: fp16
  num_workers: 2
  bucket_size: 128
  head_lr: 2.0e-4
  encoder_lr: 1.0e-5
  final_encoder_lr: 5.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  unfrozen_top_layers: 4
  checkpoint_every_steps: 2000
  log_every_steps: 25
